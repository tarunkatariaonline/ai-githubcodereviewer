name: AI Code Reviewer
description: Reviews pull request diffs with Gemini and posts inline review comments.

inputs:
  gemini-api-key:
    description: Gemini API key
    required: true
  github-token:
    description: Token used to read the PR and post the review
    default: ${{ github.token }}
  model:
    description: Gemini model to use
    default: gemini-3.5-flash-lite
  max-files:
    description: Maximum number of files to review per run
    default: '30'
  max-comments:
    description: Maximum number of inline comments per review
    default: '20'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install reviewer dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev

    - name: Review pull request
      shell: bash
      run: node "${{ github.action_path }}/src/index.js"
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GEMINI_MODEL: ${{ inputs.model }}
        MAX_FILES: ${{ inputs.max-files }}
        MAX_COMMENTS: ${{ inputs.max-comments }}
